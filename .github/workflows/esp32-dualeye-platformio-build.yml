name: ESP32 DualEye PlatformIO Build

on:
  workflow_dispatch:
  push:
    branches:
      - Main
      - main
      - koalabyte-blue-v2-heltec-edition
    paths:
      - ".github/workflows/esp32-dualeye-platformio-build.yml"
      - "firmware/esp32-dualeye/**"
      - "scripts/flash_esp32.sh"
      - "scripts/configure_esp32s3_dualeye_2g4_antenna.sh"
  pull_request:
    branches:
      - Main
      - main
      - koalabyte-blue-v2-heltec-edition
    paths:
      - ".github/workflows/esp32-dualeye-platformio-build.yml"
      - "firmware/esp32-dualeye/**"
      - "scripts/flash_esp32.sh"
      - "scripts/configure_esp32s3_dualeye_2g4_antenna.sh"

jobs:
  esp32-dualeye-platformio-build:
    name: Run pio build for ESP32-S3 DualEye
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build ESP32-S3 DualEye firmware
        shell: bash
        run: |
          set -o pipefail
          mkdir -p releases
          pio run -d firmware/esp32-dualeye 2>&1 | tee releases/esp32-dualeye-platformio.log

      - name: Package full-flash image and Windows flasher
        shell: bash
        run: |
          set -euo pipefail
          build="firmware/esp32-dualeye/.pio/build/esp32s3_dualeye"
          package="releases/koalabyte-esp32-s3-dualeye-v0.7.1-recovery-realistic-koala"
          mkdir -p "${package}"

          boot_app0="$(find "${HOME}/.platformio/packages/framework-arduinoespressif32" -path '*/tools/partitions/boot_app0.bin' -print -quit)"
          test -n "${boot_app0}"
          test -f "${build}/bootloader.bin"
          test -f "${build}/partitions.bin"
          test -f "${build}/firmware.bin"

          cp "${build}/bootloader.bin" "${package}/bootloader.bin"
          cp "${build}/partitions.bin" "${package}/partitions.bin"
          cp "${build}/firmware.bin" "${package}/firmware.bin"
          cp "${boot_app0}" "${package}/boot_app0.bin"
          cp releases/esp32-dualeye-platformio.log "${package}/build.log"

          PACKAGE_DIR="${package}" python - <<'PY'
          import os
          from pathlib import Path

          package = Path(os.environ["PACKAGE_DIR"])
          parts = [
              (0x0000, package / "bootloader.bin"),
              (0x8000, package / "partitions.bin"),
              (0xE000, package / "boot_app0.bin"),
              (0x10000, package / "firmware.bin"),
          ]
          payloads = [(offset, path.read_bytes()) for offset, path in parts]
          end = max(offset + len(payload) for offset, payload in payloads)
          image = bytearray(b"\xFF" * end)
          for offset, payload in payloads:
              image[offset:offset + len(payload)] = payload
          output = package / "koalabyte-esp32-s3-dualeye-v0.7.1-recovery-full-flash.bin"
          output.write_bytes(image)
          for offset, payload in payloads:
              assert image[offset:offset + len(payload)] == payload
          print(f"Created {output} ({len(image)} bytes)")
          PY

          cat > "${package}/flash-esp32-dualeye-recovery.ps1" <<'POWERSHELL'
          param(
            [Parameter(Mandatory=$true)]
            [string]$Port,
            [int]$Baud = 460800,
            [switch]$SkipErase
          )

          $ErrorActionPreference = "Stop"
          $Image = Join-Path $PSScriptRoot "koalabyte-esp32-s3-dualeye-v0.7.1-recovery-full-flash.bin"
          if (-not (Test-Path $Image)) { throw "Firmware image not found: $Image" }

          py -m pip install --user "esptool==4.11.0"
          if ($LASTEXITCODE -ne 0) { throw "Unable to install esptool." }

          py -m esptool --chip esp32s3 --port $Port chip_id
          if ($LASTEXITCODE -ne 0) { throw "ESP32-S3 not responding on $Port. Enter download mode and retry." }

          if (-not $SkipErase) {
            py -m esptool --chip esp32s3 --port $Port erase_flash
            if ($LASTEXITCODE -ne 0) { throw "Flash erase failed." }
          }

          py -m esptool --chip esp32s3 --port $Port --baud $Baud write_flash -z 0x0 $Image
          if ($LASTEXITCODE -ne 0) { throw "Firmware write failed." }

          Write-Host "Recovery flash complete. Press RESET once and allow the six-second boot animation to finish."
          POWERSHELL

          cat > "${package}/README-FLASH.txt" <<'README'
          KoalaByte Blue ESP32-S3 DualEye v0.7.1 recovery firmware

          Exact hardware target:
            Verified non-touch ESP32-S3 DualEye 1.28-inch variant
            Good display: LCD2, front-right / back-left / TF-card side
            No touch controller or touch panel is present

          Recovery changes:
            - initializes LCD2 only; damaged LCD1 is never selected
            - one shared 200x200 RGB565 framebuffer instead of four canvases
            - conservative 40 MHz display SPI
            - Wi-Fi, BLE, microphone and speaker disabled for stability testing
            - touch support permanently disabled for this non-touch hardware
            - realistic animated koala face with no clock/tick marks

          Windows command from this folder:
            powershell -ExecutionPolicy Bypass -File .\flash-esp32-dualeye-recovery.ps1 -Port COM9

          Replace COM9 if Windows assigns a different port.
          Disconnect the battery for the recovery flash and use USB power only.
          README

          (
            cd "${package}"
            sha256sum *.bin flash-esp32-dualeye-recovery.ps1 README-FLASH.txt build.log > SHA256SUMS.txt
          )

      - name: Upload firmware package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koalabyte-esp32-s3-dualeye-v0.7.1-recovery-realistic-koala
          path: |
            releases/koalabyte-esp32-s3-dualeye-v0.7.1-recovery-realistic-koala/**
            releases/esp32-dualeye-platformio.log
          if-no-files-found: error