name: ESP32 DualEye PlatformIO Build

on:
  workflow_dispatch:
  push:
    branches:
      - Main
      - main
      - koalabyte-blue-v2-heltec-edition
    paths:
      - ".github/workflows/esp32-dualeye-platformio-build.yml"
      - "firmware/esp32-dualeye/**"
      - "scripts/flash_esp32.sh"
      - "scripts/configure_esp32s3_dualeye_2g4_antenna.sh"
  pull_request:
    branches:
      - Main
      - main
      - koalabyte-blue-v2-heltec-edition
    paths:
      - ".github/workflows/esp32-dualeye-platformio-build.yml"
      - "firmware/esp32-dualeye/**"
      - "scripts/flash_esp32.sh"
      - "scripts/configure_esp32s3_dualeye_2g4_antenna.sh"

jobs:
  esp32-dualeye-platformio-build:
    name: Run pio build for ESP32-S3 DualEye
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build ESP32-S3 DualEye firmware
        shell: bash
        run: |
          set -o pipefail
          mkdir -p releases
          pio run -d firmware/esp32-dualeye 2>&1 | tee releases/esp32-dualeye-platformio.log

      - name: Package full-flash image and Windows flasher
        shell: bash
        run: |
          set -euo pipefail
          build="firmware/esp32-dualeye/.pio/build/esp32s3_dualeye"
          package="releases/koalabyte-esp32-s3-dualeye-v0.9.0-menu-voice-sync"
          mkdir -p "${package}"

          boot_app0="$(find "${HOME}/.platformio/packages/framework-arduinoespressif32" -path '*/tools/partitions/boot_app0.bin' -print -quit)"
          test -n "${boot_app0}"
          test -f "${build}/bootloader.bin"
          test -f "${build}/partitions.bin"
          test -f "${build}/firmware.bin"

          cp "${build}/bootloader.bin" "${package}/bootloader.bin"
          cp "${build}/partitions.bin" "${package}/partitions.bin"
          cp "${build}/firmware.bin" "${package}/firmware.bin"
          cp "${boot_app0}" "${package}/boot_app0.bin"
          cp releases/esp32-dualeye-platformio.log "${package}/build.log"

          PACKAGE_DIR="${package}" python - <<'PY'
          import os
          from pathlib import Path

          package = Path(os.environ["PACKAGE_DIR"])
          parts = [
              (0x0000, package / "bootloader.bin"),
              (0x8000, package / "partitions.bin"),
              (0xE000, package / "boot_app0.bin"),
              (0x10000, package / "firmware.bin"),
          ]
          payloads = [(offset, path.read_bytes()) for offset, path in parts]
          end = max(offset + len(payload) for offset, payload in payloads)
          image = bytearray(b"\xFF" * end)
          for offset, payload in payloads:
              image[offset:offset + len(payload)] = payload
          output = package / "koalabyte-esp32-s3-dualeye-v0.9.0-menu-voice-sync-full-flash.bin"
          output.write_bytes(image)
          for offset, payload in payloads:
              assert image[offset:offset + len(payload)] == payload
          print(f"Created {output} ({len(image)} bytes)")
          PY

          cat > "${package}/flash-esp32-dualeye-menu-voice-sync.ps1" <<'POWERSHELL'
          param(
            [Parameter(Mandatory=$true)]
            [string]$Port,
            [int]$Baud = 460800,
            [switch]$SkipErase
          )

          $ErrorActionPreference = "Stop"
          $Image = Join-Path $PSScriptRoot "koalabyte-esp32-s3-dualeye-v0.9.0-menu-voice-sync-full-flash.bin"
          if (-not (Test-Path $Image)) { throw "Firmware image not found: $Image" }

          py -m pip install --user "esptool==4.11.0"
          if ($LASTEXITCODE -ne 0) { throw "Unable to install esptool." }

          py -m esptool --chip esp32s3 --port $Port chip_id
          if ($LASTEXITCODE -ne 0) { throw "ESP32-S3 not responding on $Port. Enter download mode and retry." }

          if (-not $SkipErase) {
            py -m esptool --chip esp32s3 --port $Port erase_flash
            if ($LASTEXITCODE -ne 0) { throw "Flash erase failed." }
          }

          py -m esptool --chip esp32s3 --port $Port --baud $Baud write_flash -z 0x0 $Image
          if ($LASTEXITCODE -ne 0) { throw "Firmware write failed." }

          py -m esptool --chip esp32s3 --port $Port verify_flash 0x0 $Image
          if ($LASTEXITCODE -ne 0) { throw "Firmware verification failed." }

          Write-Host "DualEye v0.9.0 flash and verification complete. Press RESET once."
          POWERSHELL

          cat > "${package}/README-FLASH.txt" <<'README'
          KoalaByte Blue ESP32-S3 DualEye v0.9.0 menu / voice-sync firmware

          Exact hardware target:
            Waveshare ESP32-S3 DualEye 1.28-inch non-touch variant
            Both GC9A01A round LCD panels are enabled on the official shared SPI bus
            LCD2 remains the authoritative right-eye menu and critical-status display
            LCD1 provides the left-eye action/context display
            Missing-LCD1 fallback remains in the firmware architecture
            No touch controller or touch panel is expected

          Display behavior:
            - cyberpunk koala eyes remain animated while idle
            - the complete menu replaces the eyes while the menu is open
            - the right eye shows up to six menu rows and highlights the selected item
            - the left eye shows menu context or the active action name
            - during voice commands, the animated eyes remain visible with compact action/result borders
            - completed non-voice actions show action on the left and result/status on the right
            - errors preserve the eyes and flash the purple/green siren state

          Integrated nodes and audio:
            - staged BLE, Wi-Fi and audio initialization prevents the old boot loop
            - ES7210 microphone capture is sent to the Raspberry Pi for wake-word/STT routing
            - ES8311 speaker playback receives local Australian-male response PCM from the Pi
            - Wi-Fi/UDP Pi node uses USB CDC serial as provisioning and runtime fallback
            - independent ESP32 BLE advertising and passive-scan telemetry remain enabled
            - Raspberry Pi owns all menu/submenu execution and independently synchronizes the Heltec
            - accepted wake phrases: killerkoala and hey killerkoala

          Windows flash command from this folder:
            powershell -ExecutionPolicy Bypass -File .\flash-esp32-dualeye-menu-voice-sync.ps1 -Port COM9

          Replace COM9 if Windows assigns a different port.
          Disconnect the battery for the first flash and use stable USB power only.

          Raspberry Pi service:
            python scripts/run_esp32_dualeye_voice_bridge.py --port /dev/koalabyte-esp32-dualeye --seconds 31536000

          One-time Wi-Fi provisioning from the Raspberry Pi:
            python scripts/run_esp32_dualeye_voice_bridge.py --port /dev/koalabyte-esp32-dualeye --wifi-ssid YOUR_SSID --wifi-password YOUR_PASSWORD --pi-host PI_LAN_IP

          Wi-Fi credentials are sent over USB and stored in ESP32 NVS; they are not embedded in this firmware ZIP.
          README

          (
            cd "${package}"
            sha256sum *.bin flash-esp32-dualeye-menu-voice-sync.ps1 README-FLASH.txt build.log > SHA256SUMS.txt
          )

      - name: Upload firmware package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koalabyte-esp32-s3-dualeye-v0.9.0-menu-voice-sync
          path: |
            releases/koalabyte-esp32-s3-dualeye-v0.9.0-menu-voice-sync/**
            releases/esp32-dualeye-platformio.log
          if-no-files-found: error
