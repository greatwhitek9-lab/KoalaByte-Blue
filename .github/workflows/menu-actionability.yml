name: Menu Actionability

on:
  pull_request:
    paths:
      - "pi-companion/koalablue/**"
      - "scripts/check_menu_actionability.py"
      - ".github/workflows/menu-actionability.yml"
  push:
    branches:
      - Main
    paths:
      - "pi-companion/koalablue/**"
      - "scripts/check_menu_actionability.py"
      - ".github/workflows/menu-actionability.yml"

permissions:
  contents: read

jobs:
  validate-menu-actionability:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pi companion dependencies
        run: python -m pip install -r pi-companion/requirements.txt

      - name: Compile menu actionability sources
        run: |
          python -m py_compile \
            pi-companion/koalablue/menu_actionability.py \
            scripts/check_menu_actionability.py

      - name: Validate every enabled menu leaf is concrete
        env:
          PYTHONPATH: pi-companion
          KOALABYTE_MENU_SHUTDOWN_DRY_RUN: "1"
          KOALABYTE_MENU_RESET_DRY_RUN: "1"
        run: python scripts/check_menu_actionability.py
