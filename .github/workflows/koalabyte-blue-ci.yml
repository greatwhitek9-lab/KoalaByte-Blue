name: KoalaByte Blue CI

on:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

jobs:
  pi-runtime-readiness:
    name: Check final Pi OS Lite runtime and installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pi companion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pi-companion/requirements.txt

      - name: Show canonical checkout diagnostics
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "installer=$(git rev-parse HEAD:one-shot-install.sh)"
          echo "bootstrap=$(git rev-parse HEAD:install.sh)"
          echo "headless_menu=$(git rev-parse HEAD:scripts/run_headless_menu.py)"
          echo "gpio=$(git rev-parse HEAD:pi-companion/koalablue/gpio_buttons.py)"
          echo "power=$(git rev-parse HEAD:scripts/install_power_controls.sh)"
          echo "udev=$(git rev-parse HEAD:udev/99-koalabyte-blue.rules)"

      - name: Validate canonical shell helpers
        run: |
          bash -n install.sh
          bash -n one-shot-install.sh
          bash -n scripts/check_deployability.sh
          bash -n scripts/setup_pi_hardware_stage.sh
          bash -n scripts/setup_system_packages.sh
          bash -n scripts/install_power_controls.sh
          bash -n scripts/install_koalabyte_udev_rules.sh
          bash -n scripts/install_koalabyte_boot_services.sh
          bash -n scripts/install_ble_node_manager_service.sh
          bash -n scripts/install_esp32_dualeye_voice_bridge_service.sh
          bash -n scripts/configure_pi_audio_output.sh
          bash -n scripts/koalabyte_blue_boot.sh

      - name: Compile Pi runtime
        run: python -m compileall -q pi-companion scripts

      - name: Run repository readiness
        run: python scripts/check_repo_readiness.py

      - name: Validate controls, menu, voice, and display synchronization
        run: |
          PYTHONPATH=pi-companion python scripts/check_one_shot_controls.py
          PYTHONPATH=pi-companion python scripts/check_menu_actions.py
          PYTHONPATH=pi-companion KOALABYTE_MENU_SYNC=0 python scripts/check_menu_display_sync.py
          PYTHONPATH=pi-companion python scripts/check_killerkoala_face_mouth_sync.py
          PYTHONPATH=pi-companion python scripts/check_killerkoala_ai.py
          PYTHONPATH=pi-companion python scripts/check_full_runtime_dependencies.py

      - name: Validate headless services, power controls, and hardware stage
        run: |
          KOALABYTE_SERVICE_USER="$(id -un)" bash scripts/install_power_controls.sh --check-only
          bash scripts/install_koalabyte_boot_services.sh --check-only
          bash scripts/setup_pi_hardware_stage.sh --check-only

      - name: Validate final one-shot and deployability
        run: |
          KOALABYTE_SERVICE_USER="$(id -un)" bash one-shot-install.sh --check-only
          bash scripts/check_deployability.sh

  esp32-firmware-source-build:
    name: Build current ESP32-S3 DualEye source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install voice and PlatformIO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip "edge-tts==7.2.8" platformio

      - name: Build ESP32 firmware from source
        run: pio run -d firmware/esp32-dualeye

      - name: Build current T114 protocol artifacts
        run: bash scripts/build_default_t114_protocol_artifacts.sh
