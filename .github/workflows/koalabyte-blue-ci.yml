name: KoalaByte Blue CI

on:
  workflow_dispatch:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

jobs:
  whole-system-readiness:
    name: Check whole-system one-shot deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Pi companion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bluez rfkill alsa-utils ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install -r pi-companion/requirements.txt

      - name: Show canonical checkout diagnostics
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "installer=$(git rev-parse HEAD:one-shot-install.sh)"
          echo "firmware_deployer=$(git rev-parse HEAD:scripts/deploy_whole_system_firmware.sh)"
          echo "firmware_builder=$(git rev-parse HEAD:scripts/build_whole_system_firmware.sh)"
          echo "gpio=$(git rev-parse HEAD:pi-companion/koalablue/gpio_buttons.py)"
          echo "udev=$(git rev-parse HEAD:udev/99-koalabyte-blue.rules)"

      - name: Validate canonical shell helpers
        run: |
          for helper in \
            install.sh one-shot-install.sh scripts/check_deployability.sh \
            scripts/setup_pi_hardware_stage.sh scripts/setup_system_packages.sh \
            scripts/setup_killerkoala_ollama.sh scripts/setup_mopidy_player.sh \
            scripts/install_power_controls.sh scripts/install_koalabyte_udev_rules.sh \
            scripts/install_koalabyte_boot_services.sh scripts/install_ble_node_manager_service.sh \
            scripts/install_esp32_dualeye_voice_bridge_service.sh scripts/configure_pi_audio_output.sh \
            scripts/build_whole_system_firmware.sh scripts/deploy_whole_system_firmware.sh \
            scripts/flash_t114_current_uf2.sh scripts/flash_esp32_dualeye_current.sh \
            scripts/enter_t114_uf2_bootloader.sh; do
            bash -n "${helper}"
          done

      - name: Compile Pi and deployment runtime
        run: python -m compileall -q pi-companion scripts firmware/t114-combined-safe/scripts

      - name: Validate whole-system firmware deployment source
        run: python scripts/check_whole_system_deployment.py --source-only

      - name: Validate one-shot and K1-K8 controls
        run: |
          PYTHONPATH=pi-companion python scripts/check_one_shot_controls.py || {
            cat logs/one_shot/control_surface_status.json 2>/dev/null || true
            exit 1
          }

      - name: Validate menu actions
        run: PYTHONPATH=pi-companion python scripts/check_menu_actions.py

      - name: Validate menu and display synchronization
        run: PYTHONPATH=pi-companion KOALABYTE_MENU_SYNC=0 python scripts/check_menu_display_sync.py

      - name: Validate Mopidy music player integration
        run: |
          PYTHONPATH=pi-companion python scripts/check_music_player.py || {
            cat logs/music_player/music_player_readiness.json 2>/dev/null || true
            exit 1
          }

      - name: Validate KillerKoala face and mouth synchronization
        run: PYTHONPATH=pi-companion python scripts/check_killerkoala_face_mouth_sync.py

      - name: Validate Heltec BLE role failover
        run: |
          PYTHONPATH=pi-companion python scripts/check_ble_role_failover.py || {
            cat logs/ble_nodes/ble_failover_readiness.json 2>/dev/null || true
            exit 1
          }

      - name: Validate universal error alarm and dig sequence
        run: |
          PYTHONPATH=pi-companion python scripts/check_killerkoala_error_sequence.py || {
            cat logs/killerkoala/error_sequence_readiness.json 2>/dev/null || true
            exit 1
          }

      - name: Import KillerKoala expression and web modules
        run: |
          PYTHONPATH=pi-companion python - <<'PY'
          from koalablue.killerkoala_expression import classify_response_expression
          from koalablue.killerkoala_web_research import looks_like_general_question
          print(classify_response_expression("happy result").tone, looks_like_general_question("why is the sky blue"))
          PY

      - name: Import KillerKoala companion and voice modules
        run: |
          PYTHONPATH=pi-companion python - <<'PY'
          from koalablue.killerkoala_hybrid_companion import load_config
          from koalablue.killerkoala_voice_control import parse_voice_command
          print(load_config().model, parse_voice_command("killerkoala voice commands").module_key)
          PY

      - name: Import KillerKoala Australian TTS
        run: |
          PYTHONPATH=pi-companion python - <<'PY'
          from koalablue.dualeye_tts import SPOKEN_IDENTITY, WILLIAM_VOICE
          print(SPOKEN_IDENTITY, WILLIAM_VOICE)
          PY

      - name: Import KillerKoala synchronized speech bridge
        run: |
          PYTHONPATH=pi-companion python - <<'PY'
          from koalablue.esp32_dualeye_speech_synced_bridge import ESP32DualEyeVoiceBridge
          print(ESP32DualEyeVoiceBridge.__name__)
          PY

      - name: Validate KillerKoala question routing
        run: |
          PYTHONPATH=pi-companion KILLERKOALA_LLM_MODE=off KILLERKOALA_WEB_SEARCH=off python - <<'PY'
          from koalablue.killerkoala_voice_control import parse_voice_command
          from koalablue.killerkoala_web_research import looks_like_general_question, question_needs_web
          help_command = parse_voice_command("killerkoala voice commands", require_wake_word=True)
          question = parse_voice_command("killerkoala why is the sky blue", require_wake_word=True)
          assert help_command.module_key == "killerkoala_help", help_command
          assert question.module_key == "killerkoala_question", question
          assert looks_like_general_question("what is the latest firmware?")
          assert not question_needs_web("what is the latest firmware?")
          print("question routing ready")
          PY

      - name: Validate KillerKoala tone expressions
        run: |
          PYTHONPATH=pi-companion python - <<'PY'
          from koalablue.killerkoala_expression import classify_response_expression
          happy = classify_response_expression("Bonza, the action completed successfully.", status="success")
          angry = classify_response_expression("The system fault is unacceptable and blocked.", status="error")
          curious = classify_response_expression("What is the latest firmware release?", event="question")
          assert happy.tone in {"happy", "excited"}, happy
          assert angry.tone in {"angry", "error"}, angry
          assert angry.left_eye == "#A54BFF", angry
          assert angry.right_eye == "#32FF71", angry
          assert curious.tone == "curious", curious
          print(happy.to_payload())
          print(angry.to_payload())
          print(curious.to_payload())
          PY

      - name: Validate KillerKoala identity and TinyLlama model
        run: |
          PYTHONPATH=pi-companion KILLERKOALA_LLM_MODE=off KILLERKOALA_DIALOGUE_TURNS=0 python - <<'PY'
          from koalablue.dualeye_tts import SPOKEN_IDENTITY, WILLIAM_VOICE, sanitize_spoken_identity
          from koalablue.killerkoala_hybrid_companion import companion_response, load_config
          assert SPOKEN_IDENTITY == "KillerKoala"
          assert WILLIAM_VOICE == "en-AU-WilliamNeural"
          assert load_config().model == "killerkoala-tinyllama:latest"
          assert "William" not in sanitize_spoken_identity("I am William")
          response = companion_response("status", user_text="readiness", history_path=None)
          assert "William" not in response.text
          print(response.text)
          PY

      - name: Validate KillerKoala AI and William voice contract
        run: |
          PYTHONPATH=pi-companion python scripts/check_killerkoala_ai.py || {
            cat logs/killerkoala/killerkoala_ai_readiness.json 2>/dev/null || true
            exit 1
          }

      - name: Validate Python 3.13-safe PCM conversion
        run: |
          PYTHONPATH=pi-companion python - <<'PY'
          import io
          import math
          import struct
          import wave
          from koalablue.dualeye_tts import _wav_to_pcm16_mono_16k
          buffer = io.BytesIO()
          with wave.open(buffer, "wb") as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(22050)
              frames = bytearray()
              for index in range(2205):
                  value = int(12000 * math.sin(2 * math.pi * 440 * index / 22050))
                  frames.extend(struct.pack("<hh", value, value))
              wav.writeframes(bytes(frames))
          pcm = _wav_to_pcm16_mono_16k(buffer.getvalue())
          assert len(pcm) >= 3000, len(pcm)
          assert len(pcm) % 2 == 0
          print(f"PCM conversion ready: {len(pcm)} bytes")
          PY

      - name: Validate current runtime dependencies
        run: |
          PYTHONPATH=pi-companion python scripts/check_full_runtime_dependencies.py || {
            cat logs/one_shot/full_runtime_dependencies.json 2>/dev/null || true
            exit 1
          }

      - name: Validate restricted K7/K8 power controls
        run: KOALABYTE_SERVICE_USER="$(id -un)" bash scripts/install_power_controls.sh --check-only

      - name: Validate headless boot services
        run: bash scripts/install_koalabyte_boot_services.sh --check-only

      - name: Validate staged hardware inventory
        run: bash scripts/setup_pi_hardware_stage.sh --check-only

      - name: Validate complete one-shot without hardware writes
        run: KOALABYTE_SERVICE_USER="$(id -un)" INSTALL_INNOMAKER_CAN=0 bash one-shot-install.sh --check-only

      - name: Validate deployability
        run: bash scripts/check_deployability.sh
