name: KoalaByte Blue CI

on:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

jobs:
  pi-runtime-readiness:
    name: Check final Pi OS Lite runtime and installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pi companion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pi-companion/requirements.txt

      - name: Show canonical checkout diagnostics
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "installer=$(git rev-parse HEAD:one-shot-install.sh)"
          echo "bootstrap=$(git rev-parse HEAD:install.sh)"
          echo "headless_menu=$(git rev-parse HEAD:scripts/run_headless_menu.py)"
          echo "gpio=$(git rev-parse HEAD:pi-companion/koalablue/gpio_buttons.py)"
          echo "power=$(git rev-parse HEAD:scripts/install_power_controls.sh)"
          echo "udev=$(git rev-parse HEAD:udev/99-koalabyte-blue.rules)"

      - name: Validate canonical shell helpers
        run: |
          bash -n install.sh
          bash -n one-shot-install.sh
          bash -n scripts/check_deployability.sh
          bash -n scripts/setup_pi_hardware_stage.sh
          bash -n scripts/setup_system_packages.sh
          bash -n scripts/setup_killerkoala_ollama.sh
          bash -n scripts/install_power_controls.sh
          bash -n scripts/install_koalabyte_udev_rules.sh
          bash -n scripts/install_koalabyte_boot_services.sh
          bash -n scripts/install_ble_node_manager_service.sh
          bash -n scripts/install_esp32_dualeye_voice_bridge_service.sh
          bash -n scripts/configure_pi_audio_output.sh

      - name: Compile Pi runtime
        run: python -m compileall -q pi-companion scripts

      - name: Validate one-shot and K1-K8 controls
        run: |
          PYTHONPATH=pi-companion python scripts/check_one_shot_controls.py || {
            cat logs/one_shot/control_surface_status.json 2>/dev/null || true
            exit 1
          }

      - name: Validate menu actions
        run: PYTHONPATH=pi-companion python scripts/check_menu_actions.py

      - name: Validate menu and display synchronization
        run: PYTHONPATH=pi-companion KOALABYTE_MENU_SYNC=0 python scripts/check_menu_display_sync.py

      - name: Validate KillerKoala face and mouth synchronization
        run: PYTHONPATH=pi-companion python scripts/check_killerkoala_face_mouth_sync.py

      - name: Validate KillerKoala AI and William voice contract
        run: |
          PYTHONPATH=pi-companion python scripts/check_killerkoala_ai.py || {
            cat logs/killerkoala/killerkoala_ai_readiness.json 2>/dev/null || true
            exit 1
          }

      - name: Validate Python 3.13-safe PCM conversion
        run: |
          PYTHONPATH=pi-companion python - <<'PY'
          import io
          import math
          import struct
          import wave
          from koalablue.dualeye_tts import _wav_to_pcm16_mono_16k

          buffer = io.BytesIO()
          with wave.open(buffer, "wb") as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(22050)
              frames = bytearray()
              for index in range(2205):
                  value = int(12000 * math.sin(2 * math.pi * 440 * index / 22050))
                  frames.extend(struct.pack("<hh", value, value))
              wav.writeframes(bytes(frames))
          pcm = _wav_to_pcm16_mono_16k(buffer.getvalue())
          assert len(pcm) >= 3000, len(pcm)
          assert len(pcm) % 2 == 0
          print(f"PCM conversion ready: {len(pcm)} bytes")
          PY

      - name: Validate current runtime dependencies
        run: |
          PYTHONPATH=pi-companion python scripts/check_full_runtime_dependencies.py || {
            cat logs/one_shot/full_runtime_dependencies.json 2>/dev/null || true
            exit 1
          }

      - name: Validate restricted K7/K8 power controls
        run: KOALABYTE_SERVICE_USER="$(id -un)" bash scripts/install_power_controls.sh --check-only

      - name: Validate headless boot services
        run: bash scripts/install_koalabyte_boot_services.sh --check-only

      - name: Validate staged hardware inventory
        run: bash scripts/setup_pi_hardware_stage.sh --check-only

      - name: Validate final one-shot
        run: KOALABYTE_SERVICE_USER="$(id -un)" INSTALL_INNOMAKER_CAN=0 bash one-shot-install.sh --check-only

      - name: Validate deployability
        run: bash scripts/check_deployability.sh
