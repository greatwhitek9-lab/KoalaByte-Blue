name: KoalaByte Complete One-Shot Bundle

on:
  workflow_dispatch:
  pull_request:
    branches:
      - Main
      - main
    paths:
      - ".github/workflows/complete-one-shot-bundle.yml"
      - "one-shot-install.sh"
      - "firmware/prebuilt/manifest.json"
      - "scripts/check_dualeye_wake_session.py"
      - "scripts/verify_prebuilt_firmware_bundle.py"
      - "scripts/configure_pi_audio_output.sh"
      - "scripts/flash_prebuilt_esp32_dualeye.sh"
      - "scripts/flash_prebuilt_t114_uf2.sh"
      - "scripts/install_koalabyte_one_shot.sh"
      - "scripts/install_pi.sh"
      - "pi-companion/**"
      - "systemd/**"
      - "udev/**"

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    name: Assemble verified Pi and peripheral installer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Download verified ESP32 v0.9.8 two-stage wake artifact
        uses: actions/download-artifact@v4
        with:
          name: koalabyte-esp32-s3-dualeye-v0.9.8-killerkoala-wake-session
          repository: greatwhitek9-lab/KoalaByte-Blue
          run-id: 29734326505
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/koalabyte-esp32

      - name: Download verified T114 original-mouth artifact
        uses: actions/download-artifact@v4
        with:
          name: koalabyte-t114-recovery-pr17-v7-smooth-cyber-koala-speech-mouth-right-landscape-239a-ht-n5262
          repository: greatwhitek9-lab/KoalaByte-Blue
          run-id: 29728794627
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/koalabyte-t114

      - name: Install exact prebuilt images
        shell: bash
        run: |
          set -euo pipefail
          esp32_source="$(find /tmp/koalabyte-esp32 -type f -name 'koalabyte-esp32-s3-dualeye-v0.9.8-killerkoala-wake-session-full-flash.bin' -print -quit)"
          t114_source="$(find /tmp/koalabyte-t114 -type f -name '*.uf2' -print -quit)"
          test -n "${esp32_source}"
          test -n "${t114_source}"
          mkdir -p firmware/prebuilt/esp32 firmware/prebuilt/t114
          cp "${esp32_source}" firmware/prebuilt/esp32/koalabyte-esp32-s3-dualeye-v0.9.8-killerkoala-wake-session-full-flash.bin
          cp "${t114_source}" firmware/prebuilt/t114/koalabyte-t114-final-original-mouth-continuous-warp-latched-koalagotchi-right-landscape-ht-n5262.uf2
          test "$(sha256sum firmware/prebuilt/esp32/*.bin | awk '{print $1}')" = "ac87c9689b4582944cf5f94577d0fc40db5ccea03858b946e1070fcf26310618"
          test "$(sha256sum firmware/prebuilt/t114/*.uf2 | awk '{print $1}')" = "c0e0a0d288237c55c629bbc78b8ece19ccaf37bea3356ee07cb206ddaef9d9dd"

      - name: Validate wake session and firmware manifest
        run: |
          set -euo pipefail
          python3 scripts/check_dualeye_wake_session.py
          python3 scripts/verify_prebuilt_firmware_bundle.py --strict
          bash -n install.sh
          bash -n one-shot-install.sh
          bash -n scripts/configure_pi_audio_output.sh
          bash -n scripts/flash_prebuilt_esp32_dualeye.sh
          bash -n scripts/flash_prebuilt_t114_uf2.sh
          bash -n scripts/install_koalabyte_one_shot.sh

      - name: Assemble complete one-shot package
        shell: bash
        run: |
          set -euo pipefail
          package_root="dist/KoalaByte-Blue-Complete-One-Shot"
          rm -rf dist
          mkdir -p "${package_root}"
          rsync -a \
            --exclude '.git' \
            --exclude '.pio' \
            --exclude 'build' \
            --exclude 'dist' \
            --exclude 'exports' \
            --exclude 'logs' \
            --exclude '__pycache__' \
            README.md install.sh one-shot-install.sh scripts pi-companion firmware docs production systemd udev logrotate version training .github \
            "${package_root}/"
          cp /tmp/koalabyte-esp32/koalabyte-esp32-s3-dualeye-v0.9.8-killerkoala-wake-session/README-FLASH.txt "${package_root}/firmware/prebuilt/esp32/ESP32-FLASH-DETAILS.txt"
          cp /tmp/koalabyte-esp32/koalabyte-esp32-s3-dualeye-v0.9.8-killerkoala-wake-session/wake-session-validation.json "${package_root}/firmware/prebuilt/esp32/wake-session-validation.json"
          cat > "${package_root}/START-HERE.txt" <<'EOF'
          KoalaByte Blue complete Pi and peripheral installer

          On the Raspberry Pi:
            cd KoalaByte-Blue-Complete-One-Shot
            bash one-shot-install.sh --check-only
            bash one-shot-install.sh

          Connected hardware:
            - ESP32-S3 DualEye: v0.9.8 is flashed automatically only after positive
              identification or when explicitly requested.
            - Heltec T114: the latest UF2 is bundled. It is copied only when the
              HT-n5262 bootloader volume is present. The already-flashed T114 can
              remain connected normally and will be preserved.
            - InnoMaker: stock firmware is retained; Linux SocketCAN can0 is configured.
            - JBL/USB speaker: the installer prefers it for Pi-owned speech when detected.

          DualEye wake policy:
            While sleeping, MultiNet loads only KillerKoala and Hey KillerKoala.
            A recognized wake phrase opens a ten-second session, changes the eyes to
            the animated listening state, and loads the complete K1-K8/menu grammar.
            Commands inside that session do not repeat KillerKoala. Accepted voice,
            K1-K8, and attached-keyboard input refresh the timer. Timeout restores
            animated idle eyes and the two-phrase wake-only grammar.

          T114 hardware note:
            The correct original purple/green face is confirmed. Idle mouth movement
            remains physically unconfirmed/static and is not represented as a passed gate.
          EOF
          (
            cd "${package_root}"
            sha256sum \
              firmware/prebuilt/manifest.json \
              firmware/prebuilt/esp32/*.bin \
              firmware/prebuilt/t114/*.uf2 \
              one-shot-install.sh > COMPLETE-SHA256SUMS.txt
          )
          (cd dist && zip -r KoalaByte-Blue-Complete-One-Shot.zip KoalaByte-Blue-Complete-One-Shot >/dev/null)
          sha256sum dist/KoalaByte-Blue-Complete-One-Shot.zip > dist/KoalaByte-Blue-Complete-One-Shot.zip.sha256
          unzip -t dist/KoalaByte-Blue-Complete-One-Shot.zip

      - name: Upload complete installer
        uses: actions/upload-artifact@v4
        with:
          name: KoalaByte-Blue-Complete-One-Shot
          path: |
            dist/KoalaByte-Blue-Complete-One-Shot.zip
            dist/KoalaByte-Blue-Complete-One-Shot.zip.sha256
          if-no-files-found: error
          retention-days: 30
