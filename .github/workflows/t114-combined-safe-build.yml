name: Build Heltec T114 Right-Landscape Recovery UF2

on:
  workflow_dispatch:

  pull_request:
    branches:
      - Main
    paths:
      - ".github/workflows/t114-combined-safe-build.yml"
      - "boards/heltec/heltec_t114_v2/**"
      - "firmware/t114-combined-safe/**"
      - "scripts/build_t114_combined_safe.sh"
      - "scripts/inspect_uf2.py"
      - "scripts/patch_uf2_family.py"
      - "scripts/verify_uf2_vector.py"
      - "scripts/setup_nrf_connect_sdk_toolchain.sh"
      - "scripts/setup_nrf_tools.sh"
      - "scripts/setup_system_packages.sh"

  push:
    branches:
      - Main
    paths:
      - ".github/workflows/t114-combined-safe-build.yml"
      - "boards/heltec/heltec_t114_v2/**"
      - "firmware/t114-combined-safe/**"
      - "scripts/build_t114_combined_safe.sh"
      - "scripts/inspect_uf2.py"
      - "scripts/patch_uf2_family.py"
      - "scripts/verify_uf2_vector.py"
      - "scripts/setup_nrf_connect_sdk_toolchain.sh"
      - "scripts/setup_nrf_tools.sh"
      - "scripts/setup_system_packages.sh"

permissions:
  contents: read

concurrency:
  group: t114-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate HT-n5262 right-landscape image
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      NCS_WORKSPACE: ${{ github.workspace }}/.ncs
      NCS_REVISION: v2.9.0
      ZEPHYR_SDK_VERSION: 0.16.8
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/zephyr-sdk-0.16.8
      INSTALL_NCS_TOOLCHAIN: "1"
      STRICT_NCS_TOOLCHAIN: "1"
      SKIP_NCS_UPDATE: "0"
      VALIDATE_BUILD: "0"
      T114_BOARD: heltec_t114_v2/nrf52840/uf2
      T114_BOARD_ROOT: ${{ github.workspace }}
      T114_COMBINED_APP_DIR: firmware/t114-combined-safe
      T114_COMBINED_BUILD_DIR: build/t114-combined-safe
      STRICT_T114_COMBINED_BUILD: "1"

    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore NCS and Zephyr SDK cache
        id: ncs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.NCS_WORKSPACE }}
            ${{ env.ZEPHYR_SDK_INSTALL_DIR }}
          key: t114-ncs-${{ env.NCS_REVISION }}-zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare isolated Python bootstrap
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "${RUNNER_TEMP}/ncs-bootstrap"
          "${RUNNER_TEMP}/ncs-bootstrap/bin/python" -m pip install --upgrade pip wheel setuptools west
          echo "${RUNNER_TEMP}/ncs-bootstrap/bin" >> "${GITHUB_PATH}"

      - name: Install nRF Connect SDK v2.9 and Zephyr SDK
        shell: bash
        env:
          PYTHON_BIN: ${{ runner.temp }}/ncs-bootstrap/bin/python
          SKIP_NCS_UPDATE: ${{ steps.ncs-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: bash scripts/setup_nrf_connect_sdk_toolchain.sh

      - name: Save NCS and Zephyr SDK cache
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.NCS_WORKSPACE }}
            ${{ env.ZEPHYR_SDK_INSTALL_DIR }}
          key: ${{ steps.ncs-cache.outputs.cache-primary-key }}

      - name: Build T114 artwork splash, mood mouth library, and menu runtime
        shell: bash
        run: |
          source logs/nrf_connect_sdk_env.sh
          splash="firmware/t114-combined-safe/assets/killerkoala-bootsplash-240x135.rgb565be"
          test "$(wc -c < "${splash}")" -eq 64800
          echo '7e097b1966de7bc9338a825917be4d71480bae226373eb993cf2ac8e5f0dab26  firmware/t114-combined-safe/assets/killerkoala-bootsplash-240x135.rgb565be' | sha256sum -c -
          while read -r expected stem; do
            decoded="${RUNNER_TEMP}/${stem}.rgb565be"
            python3 firmware/t114-combined-safe/scripts/decode_base64_asset.py \
              --expected-bytes 64800 \
              --expected-sha256 "${expected}" \
              --output "${decoded}" \
              "firmware/t114-combined-safe/assets/${stem}.rgb565be.b64.part0" \
              "firmware/t114-combined-safe/assets/${stem}.rgb565be.b64.part1"
            test "$(wc -c < "${decoded}")" -eq 64800
            echo "${expected}  ${decoded}" | sha256sum -c -
          done <<'MOUTHS'
          4ac8487889927f12245b7aab18bcbae67a136d435bedfbc12d64b6438b325c0b killerkoala-cyber-mouth-smile-240x135
          16753b3a5ae15a9946c7a519203d181ac4c1d21a121f7de6699497bbc96c4f00 killerkoala-cyber-mouth-happy-240x135
          7473bc86850497c03067fce47f3bd2bdf6166ca0ac1cbc14f19dc579adac93cd killerkoala-cyber-mouth-bite-240x135
          265f944b10b4cab58ee0d84b5e67fbec805a2cd7774829641697a3077f058ed0 killerkoala-cyber-mouth-snarl-240x135
          2698c29d589abe9b3582be48f630da71ce0c3051d7656d7f4ba57556fd435e49 killerkoala-cyber-mouth-sideways-grin-240x135
          MOUTHS
          grep -Fq 'render_killerkoala_boot_splash' firmware/t114-combined-safe/src/loading_display.c
          grep -Fq 'render_koalagotchi_action' firmware/t114-combined-safe/src/loading_display.c
          grep -Fq 'render_killerkoala_mouth' firmware/t114-combined-safe/src/loading_display.c
          grep -Fq '#define KILLERKOALA_MOUTH_TEXT_FREE 1' firmware/t114-combined-safe/src/loading_display.c
          grep -Fq '#define KILLERKOALA_CYBER_MOUTH_FRAME_BYTES 64800' firmware/t114-combined-safe/src/loading_display.c
          grep -Fq '#define KOALA_BOOT_SPLASH_MS 6000' firmware/t114-combined-safe/src/main.c
          grep -Fq 'expression_from_koalagotchi' firmware/t114-combined-safe/src/main.c
          grep -Fq 'sideways_grin_frames' firmware/t114-combined-safe/src/main.c
          grep -Fq 'strcmp(current_display_mode(), "killerkoala_mouth") == 0' firmware/t114-combined-safe/src/main.c
          grep -Fq 'render_menu_status' firmware/t114-combined-safe/src/loading_display.c
          grep -Fq '#define TFT_WIDTH 240' firmware/t114-combined-safe/src/loading_display.c
          grep -Fq '#define TFT_HEIGHT 135' firmware/t114-combined-safe/src/loading_display.c
          bash scripts/build_t114_combined_safe.sh

      - name: Verify partition, controller, display, and role contract
        shell: bash
        run: |
          image_dir="build/t114-combined-safe/zephyr"
          cfg="${image_dir}/.config"
          dts="${image_dir}/zephyr.dts"
          for required in \
            'CONFIG_BT=y' \
            'CONFIG_BT_CTLR=y' \
            'CONFIG_BT_LL_SW_SPLIT=y' \
            'CONFIG_BT_OBSERVER=y' \
            'CONFIG_BT_BROADCASTER=y' \
            'CONFIG_USB_DEVICE_STACK=y' \
            'CONFIG_USB_CDC_ACM=y' \
            'CONFIG_DISPLAY=y' \
            'CONFIG_ST7789V=y' \
            'CONFIG_ST7789V_RGB565=y' \
            'CONFIG_BUILD_OUTPUT_UF2=y' \
            'CONFIG_FLASH_LOAD_OFFSET=0x26000'; do
            grep -Fxq "${required}" "${cfg}"
          done
          for forbidden in \
            'CONFIG_BT_LL_SOFTDEVICE=y' \
            'CONFIG_BT_CENTRAL=y' \
            'CONFIG_BT_PERIPHERAL=y' \
            'CONFIG_BT_SCAN_WITH_IDENTITY=y' \
            'CONFIG_LORA=y' \
            'CONFIG_PARTITION_MANAGER_ENABLED=y'; do
            if grep -Fxq "${forbidden}" "${cfg}"; then
              echo "Forbidden configuration is enabled: ${forbidden}" >&2
              exit 1
            fi
          done
          grep -E '^(CONFIG_BT_LL_|CONFIG_BT_CTLR|CONFIG_BT_OBSERVER|CONFIG_BT_BROADCASTER|CONFIG_USB_DEVICE_STACK|CONFIG_USB_CDC_ACM|CONFIG_DISPLAY|CONFIG_ST7789V|CONFIG_FLASH_LOAD_OFFSET)' "${cfg}"
          grep -Fq 'zephyr,bt-hci = &bt_hci_controller' "${dts}"
          grep -Fq 'compatible = "zephyr,bt-hci-ll-sw-split"' "${dts}"
          grep -Fq 'zephyr,console = &board_cdc_acm_uart' "${dts}"
          grep -Fq 'code_partition: partition@26000' "${dts}"
          grep -Fq 'compatible = "sitronix,st7789v"' "${dts}"
          grep -Fq 'width = < 0xf0 >' "${dts}"
          grep -Fq 'height = < 0x87 >' "${dts}"
          grep -Fq 'x-offset = < 0x28 >' "${dts}"
          grep -Fq 'y-offset = < 0x35 >' "${dts}"
          grep -Fq 'mdac = < 0x60 >' "${dts}"
          grep -Fq 'uart1: uart@40028000' "${dts}"
          grep -Fq 'compatible = "semtech,sx1262"' "${dts}"
          for marker in \
            'render_killerkoala_boot_splash' \
            'render_koalagotchi_action' \
            'render_killerkoala_mouth' \
            'render_menu_status' \
            'start_ble_primary' \
            'init_gnss' \
            'killerkoala_face' \
            'ble_lab_advertise_start' \
            'node_roles' \
            'lora_status'; do
            grep -Fq "${marker}" firmware/t114-combined-safe/src/*.c
          done
          PYTHONPATH=pi-companion python3 scripts/check_killerkoala_loading_face.py
          PYTHONPATH=pi-companion python3 scripts/check_killerkoala_face_mouth_sync.py
          PYTHONPATH=pi-companion python3 scripts/check_menu_display_sync.py
          PYTHONPATH=pi-companion python3 scripts/check_one_shot_controls.py

      - name: Patch and prove the HT-n5262 UF2 boot vector
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          image_dir="build/t114-combined-safe/zephyr"
          raw="${image_dir}/zephyr.uf2"
          output="releases/koalabyte-t114-recovery-pr17-v6-cyber-koala-mood-mouth-right-landscape-239a-ht-n5262.uf2"
          mkdir -p releases
          python3 scripts/inspect_uf2.py "${raw}" | tee releases/uf2-raw-metadata.txt
          python3 scripts/patch_uf2_family.py "${raw}" "${output}" 0x239a0071
          python3 scripts/inspect_uf2.py "${output}" | tee releases/uf2-patched-metadata.txt
          grep -Fq 'Address min: 0x00026000' releases/uf2-patched-metadata.txt
          grep -Fq "Families: ['0x239a0071']" releases/uf2-patched-metadata.txt
          python3 scripts/verify_uf2_vector.py "${output}" \
            --vector-address 0x26000 \
            --application-min 0x26000 \
            --application-max 0xec000 \
            --family 0x239a0071 | tee releases/vector-validation.txt
          grep -Fq 'Reset handler range valid: true' releases/vector-validation.txt
          sha256sum "${output}" | tee releases/SHA256SUMS.txt
          {
            echo "source_commit=${SOURCE_COMMIT}"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "board=heltec_t114_v2/nrf52840/uf2"
            echo "profile=t114-combined-safe-recovery"
            echo "bluetooth_controller=zephyr_ll_sw_split"
            echo "ncs=v2.9.0"
            echo "zephyr_sdk=0.16.8"
            echo "uf2_family=0x239a0071"
            echo "expected_offset=0x00026000"
            echo "sysbuild=disabled"
            echo "vector_relocation=validated"
            echo "display_orientation=landscape_right_90_from_v2"
            echo "display_geometry=240x135_offset_40_53_mdac_0x60"
            echo "boot_sequence=uploaded_killerkoala_artwork_6000ms_to_text_free_cyber_koala_mood_mouth"
            echo "boot_splash_rgb565_sha256=7e097b1966de7bc9338a825917be4d71480bae226373eb993cf2ac8e5f0dab26"
            echo "koalagotchi_action_mode=heltec_animation_dualeye_action_label"
            echo "koalagotchi_mouth_modes=smile_bite_snarl_sideways_grin_from_health_and_mood"
            echo "normal_profile=usb_ble_gnss_display"
            echo "meshtastic_profile=separate_pi_managed_uf2"
          } > releases/build-provenance.txt
          cat > releases/FLASH-INSTRUCTIONS.txt <<'EOF'
          KoalaByte T114 recovery image

          1. Do not use the earlier KoalaByte-T114-combined-safe-PR17.zip image.
          2. Connect the Heltec T114 directly to the Windows PC with a known data USB-C cable.
          3. Double-press RST quickly. A drive named HT-n5262 should appear.
          4. Copy koalabyte-t114-recovery-pr17-v6-cyber-koala-mood-mouth-right-landscape-239a-ht-n5262.uf2 to HT-n5262.
          5. The drive should disconnect automatically. Do not unplug during the copy.
          6. Wait 15 seconds. Expect the supplied artwork for six seconds, then the text-free cyberpunk Koala mood-mouth animation.
          7. Windows should enumerate a non-Bluetooth USB CDC serial port for VID_2FE3 and PID_0100.

          This artifact was rejected unless its vector table and reset handler both fell inside
          the HT-n5262 application partition at 0x00026000-0x000ebfff.
          EOF

      - name: Upload hardware-validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: koalabyte-t114-recovery-pr17-v6-cyber-koala-mood-mouth-right-landscape-239a-ht-n5262
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: |
            releases/koalabyte-t114-recovery-pr17-v6-cyber-koala-mood-mouth-right-landscape-239a-ht-n5262.uf2
            releases/uf2-raw-metadata.txt
            releases/uf2-patched-metadata.txt
            releases/SHA256SUMS.txt
            releases/build-provenance.txt
            releases/vector-validation.txt
            releases/FLASH-INSTRUCTIONS.txt
            build/t114-combined-safe/zephyr/zephyr.elf
            build/t114-combined-safe/zephyr/zephyr.map
            build/t114-combined-safe/zephyr/zephyr.hex
            build/t114-combined-safe/zephyr/.config
            build/t114-combined-safe/zephyr/zephyr.dts
            logs/t114_combined_safe_build_status.json
            logs/killerkoala_face/loading_face_readiness.json
            logs/killerkoala_face/face_mouth_sync_status.json
            logs/one_shot/menu_display_sync_status.json
            logs/one_shot/control_surface_status.json
