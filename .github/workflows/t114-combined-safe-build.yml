name: Build Heltec T114 Combined Safe UF2

on:
  workflow_dispatch:
  push:
    branches: [ Main ]
    paths:
      - "firmware/t114-combined-safe/**"
      - "scripts/build_t114_combined_safe.sh"
      - ".github/workflows/t114-combined-safe-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            gperf \
            ccache \
            dfu-util \
            device-tree-compiler \
            wget \
            python3-pip

      - name: Install west
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install west
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install nRF Connect SDK
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v2.9.0 ncs
          cd ncs
          west update
          west zephyr-export
          python3 -m pip install -r zephyr/scripts/requirements.txt

      - name: Show Zephyr information
        run: |
          cd ncs/zephyr
          echo "========== WEST =========="
          west --version
          echo
          echo "========== ZEPHYR VERSION =========="
          git describe --tags || true
          git rev-parse HEAD
          echo
          echo "========== BOARDS DIRECTORY =========="
          ls boards
          echo
          echo "========== HELTEC BOARDS =========="
          find boards -type d | grep heltec || true
          echo
          echo "========== SEARCHING FOR heltec_t114_v2 =========="
          find boards -type d -name "heltec_t114_v2" || true

      - name: Build firmware
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/ncs/zephyr
        run: |
          chmod +x scripts/build_t114_combined_safe.sh
          scripts/build_t114_combined_safe.sh

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heltec-t114-firmware
          path: |
            build/**/*.uf2
            build/**/*.hex
            build/**/*.bin
            logs/**/*.json
