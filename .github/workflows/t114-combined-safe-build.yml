name: Build Heltec T114 Combined Safe UF2

on:
  workflow_dispatch:

  push:
    branches:
      - Main
    paths:
      - "boards/**"
      - "firmware/t114-combined-safe/**"
      - "scripts/build_t114_combined_safe.sh"
      - ".github/workflows/t114-combined-safe-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BOARD: heltec_t114_v2/nrf52840/uf2
      BOARD_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            ninja-build \
            cmake \
            gperf \
            ccache \
            device-tree-compiler \
            dfu-util \
            python3-pip

      - name: Install west
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install west
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Fetch nRF Connect SDK v3.1.0
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.1.0 ncs
          cd ncs
          west update
          west zephyr-export
          pip3 install -r zephyr/scripts/requirements.txt

      - name: Install Zephyr SDK
        run: |
          cd $HOME
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.0/zephyr-sdk-0.17.0_linux-x86_64.tar.xz
          tar xf zephyr-sdk-0.17.0_linux-x86_64.tar.xz
          cd zephyr-sdk-0.17.0
          ./setup.sh -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk-0.17.0" >> $GITHUB_ENV

      - name: Verify custom board
        run: |
          echo "Repository root:"
          pwd

          echo
          echo "Boards directory:"
          find boards -maxdepth 3 -type d || true

          echo
          echo "Heltec board:"
          ls -R boards/heltec/heltec_t114_v2

      - name: Build firmware
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/ncs/zephyr
          BOARD_ROOT: ${{ github.workspace }}
          T114_BOARD: heltec_t114_v2/nrf52840/uf2
          T114_BOARD_ROOT: ${{ github.workspace }}
        run: |
          chmod +x scripts/build_t114_combined_safe.sh
          ./scripts/build_t114_combined_safe.sh

      - name: Show build output
        if: always()
        run: |
          find build -type f || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: heltec-t114-combined-safe
          path: |
            build/**/*.uf2
            build/**/*.hex
            build/**/*.bin
            build/**/*.elf
