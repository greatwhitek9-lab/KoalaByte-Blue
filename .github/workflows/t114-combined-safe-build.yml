name: Build Heltec T114 Combined Safe UF2

on:
  workflow_dispatch:

  push:
    branches:
      - Main
    paths:
      - "boards/**"
      - "firmware/t114-combined-safe/**"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository contents
        run: |
          pwd
          ls -la
          echo ""
          echo "===== Custom Boards ====="
          find boards -type f || true

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            gperf \
            ccache \
            dfu-util \
            device-tree-compiler \
            wget \
            python3-pip

      - name: Install west
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install west
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install nRF Connect SDK v3.1.0
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.1.0 ncs
          cd ncs
          west update
          west zephyr-export
          python3 -m pip install -r zephyr/scripts/requirements.txt

      - name: Show SDK version
        run: |
          cd ncs/zephyr
          git describe --tags --always
          git rev-parse HEAD

      - name: Verify custom board exists
        run: |
          echo "===== Looking for custom board ====="
          find boards -type d -name "heltec_t114_v2"
          echo ""
          echo "===== Board files ====="
          find boards/heltec/heltec_t114_v2 -type f || true

      - name: Show SDK Heltec boards
        run: |
          echo "===== SDK Boards ====="
          find ncs/zephyr/boards -iname "*heltec*" || true

      - name: Build firmware
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/ncs/zephyr
          BOARD_ROOT: ${{ github.workspace }}
        run: |
          export BOARD_ROOT="${{ github.workspace }}"
          chmod +x scripts/build_t114_combined_safe.sh
          scripts/build_t114_combined_safe.sh

      - name: Show build output
        if: always()
        run: |
          echo "===== Build Directory ====="
          find build -type f || true

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heltec-t114-firmware
          path: |
            build/**/*.uf2
            build/**/*.hex
            build/**/*.bin
