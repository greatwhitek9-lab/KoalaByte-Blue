name: Build Heltec T114 combined-safe UF2

on:
  workflow_dispatch:
  pull_request:
    branches:
      - Main
    paths:
      - .github/workflows/t114-uf2-build.yml
      - boards/heltec/heltec_t114_v2/**
      - firmware/t114-combined-safe/**
      - scripts/build_t114_combined_safe.sh
      - scripts/inspect_uf2.py
      - scripts/patch_uf2_family.py
      - scripts/setup_nrf_connect_sdk_toolchain.sh
      - scripts/setup_nrf_tools.sh
      - scripts/setup_system_packages.sh
  push:
    branches:
      - Main
    paths:
      - .github/workflows/t114-uf2-build.yml
      - boards/heltec/heltec_t114_v2/**
      - firmware/t114-combined-safe/**
      - scripts/build_t114_combined_safe.sh
      - scripts/inspect_uf2.py
      - scripts/patch_uf2_family.py
      - scripts/setup_nrf_connect_sdk_toolchain.sh
      - scripts/setup_nrf_tools.sh
      - scripts/setup_system_packages.sh

permissions:
  contents: read

concurrency:
  group: t114-uf2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-t114-combined-safe:
    name: Build corrected T114 display UF2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NCS_WORKSPACE: ${{ github.workspace }}/.ncs
      NCS_REVISION: v2.9.0
      ZEPHYR_SDK_VERSION: 0.16.8
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/zephyr-sdk-0.16.8
      INSTALL_NCS_TOOLCHAIN: "1"
      STRICT_NCS_TOOLCHAIN: "1"
      SKIP_NCS_UPDATE: "0"
      VALIDATE_BUILD: "0"
      T114_BOARD: heltec_t114_v2/nrf52840/uf2
      T114_BOARD_ROOT: ${{ github.workspace }}
      T114_COMBINED_APP_DIR: firmware/t114-combined-safe
      T114_COMBINED_BUILD_DIR: build/t114-combined-safe
      STRICT_T114_COMBINED_BUILD: "1"

    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore NCS and Zephyr SDK cache
        id: ncs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.NCS_WORKSPACE }}
            ${{ env.ZEPHYR_SDK_INSTALL_DIR }}
          key: t114-ncs-${{ env.NCS_REVISION }}-zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare isolated Python bootstrap
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "${RUNNER_TEMP}/ncs-bootstrap"
          "${RUNNER_TEMP}/ncs-bootstrap/bin/python" -m pip install --upgrade pip wheel setuptools west
          echo "${RUNNER_TEMP}/ncs-bootstrap/bin" >> "${GITHUB_PATH}"

      - name: Install nRF Connect SDK v2.9 and Zephyr SDK
        shell: bash
        env:
          PYTHON_BIN: ${{ runner.temp }}/ncs-bootstrap/bin/python
          SKIP_NCS_UPDATE: ${{ steps.ncs-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: bash scripts/setup_nrf_connect_sdk_toolchain.sh

      - name: Save NCS and Zephyr SDK cache
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.NCS_WORKSPACE }}
            ${{ env.ZEPHYR_SDK_INSTALL_DIR }}
          key: ${{ steps.ncs-cache.outputs.cache-primary-key }}

      - name: Build combined-safe display BLE GNSS firmware
        shell: bash
        run: |
          source logs/nrf_connect_sdk_env.sh
          grep -Fq 'render_loading_banner("LOADING")' firmware/t114-combined-safe/src/loading_display.c
          bash scripts/build_t114_combined_safe.sh

      - name: Verify KoalaByte feature and role contract
        shell: bash
        run: |
          image_dir="build/t114-combined-safe/t114-combined-safe/zephyr"
          cfg="${image_dir}/.config"
          dts="${image_dir}/zephyr.dts"
          for required in \
            'CONFIG_BT=y' \
            'CONFIG_BT_CTLR=y' \
            'CONFIG_BT_LL_SW_SPLIT=y' \
            'CONFIG_BT_OBSERVER=y' \
            'CONFIG_BT_BROADCASTER=y' \
            'CONFIG_USB_DEVICE_STACK=y' \
            'CONFIG_USB_CDC_ACM=y' \
            'CONFIG_DISPLAY=y' \
            'CONFIG_ST7789V=y' \
            'CONFIG_ST7789V_RGB565=y' \
            'CONFIG_BUILD_OUTPUT_UF2=y' \
            'CONFIG_FLASH_LOAD_OFFSET=0x26000'; do
            grep -Fxq "${required}" "${cfg}"
          done
          for forbidden in \
            'CONFIG_BT_LL_SOFTDEVICE=y' \
            'CONFIG_BT_CENTRAL=y' \
            'CONFIG_BT_PERIPHERAL=y' \
            'CONFIG_BT_SCAN_WITH_IDENTITY=y' \
            'CONFIG_LORA=y'; do
            if grep -Fxq "${forbidden}" "${cfg}"; then
              echo "Forbidden configuration is enabled: ${forbidden}" >&2
              exit 1
            fi
          done
          grep -E '^(CONFIG_BT_LL_|CONFIG_BT_CTLR|CONFIG_BT_OBSERVER|CONFIG_BT_BROADCASTER|CONFIG_USB_DEVICE_STACK|CONFIG_USB_CDC_ACM|CONFIG_DISPLAY|CONFIG_ST7789V|CONFIG_FLASH_LOAD_OFFSET)' "${cfg}"
          grep -Fq 'zephyr,bt-hci = &bt_hci_controller' "${dts}"
          grep -Fq 'compatible = "zephyr,bt-hci-ll-sw-split"' "${dts}"
          grep -Fq 'zephyr,console = &board_cdc_acm_uart' "${dts}"
          grep -Fq 'code_partition: partition@26000' "${dts}"
          grep -Fq 'compatible = "sitronix,st7789v"' "${dts}"
          grep -Fq 'uart1: uart@40028000' "${dts}"
          grep -Fq 'compatible = "semtech,sx1262"' "${dts}"
          for marker in \
            'render_loading_banner("LOADING")' \
            'start_ble_primary' \
            'init_gnss' \
            'killerkoala_face' \
            'ble_lab_advertise_start' \
            'node_roles' \
            'lora_status'; do
            grep -Fq "${marker}" firmware/t114-combined-safe/src/*.c
          done
          PYTHONPATH=pi-companion python3 scripts/check_killerkoala_loading_face.py
          PYTHONPATH=pi-companion python3 scripts/check_killerkoala_face_mouth_sync.py
          PYTHONPATH=pi-companion python3 scripts/check_menu_display_sync.py
          PYTHONPATH=pi-companion python3 scripts/check_one_shot_controls.py

      - name: Patch and verify HT-n5262 UF2 metadata
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          image_dir="build/t114-combined-safe/t114-combined-safe/zephyr"
          raw="${image_dir}/zephyr.uf2"
          output="releases/koalabyte-t114-combined-safe-display-llsplit-ht-n5262.uf2"
          mkdir -p releases
          python3 scripts/inspect_uf2.py "${raw}" | tee releases/uf2-raw-metadata.txt
          python3 scripts/patch_uf2_family.py "${raw}" "${output}" 0xada52840
          python3 scripts/inspect_uf2.py "${output}" | tee releases/uf2-patched-metadata.txt
          grep -Fq 'Address min: 0x00026000' releases/uf2-patched-metadata.txt
          grep -Fq "Families: ['0xada52840']" releases/uf2-patched-metadata.txt
          sha256sum "${output}" | tee releases/SHA256SUMS.txt
          {
            echo "source_commit=${SOURCE_COMMIT}"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "board=heltec_t114_v2/nrf52840/uf2"
            echo "profile=t114-combined-safe"
            echo "bluetooth_controller=zephyr_ll_sw_split"
            echo "ncs=v2.9.0"
            echo "zephyr_sdk=0.16.8"
            echo "uf2_family=0xada52840"
            echo "expected_offset=0x00026000"
          } > releases/build-provenance.txt

      - name: Upload hardware-validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: koalabyte-t114-combined-safe-display-llsplit-ht-n5262
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: |
            releases/koalabyte-t114-combined-safe-display-llsplit-ht-n5262.uf2
            releases/uf2-raw-metadata.txt
            releases/uf2-patched-metadata.txt
            releases/SHA256SUMS.txt
            releases/build-provenance.txt
            build/t114-combined-safe/t114-combined-safe/zephyr/.config
            build/t114-combined-safe/t114-combined-safe/zephyr/zephyr.dts
            logs/t114_combined_safe_build_status.json
            logs/killerkoala_face/loading_face_readiness.json
            logs/killerkoala_face/face_mouth_sync_status.json
            logs/one_shot/menu_display_sync_status.json
            logs/one_shot/control_surface_status.json
