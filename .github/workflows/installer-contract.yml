name: Installer Contract

on:
  workflow_dispatch:
  push:
    branches: [Main, main]
    paths:
      - "install.sh"
      - "one-shot-install.sh"
      - "scripts/**"
      - "pi-companion/**"
      - "firmware/**"
      - "training/**"
      - "systemd/**"
      - ".github/workflows/installer-contract.yml"
  pull_request:
    branches: [Main, main]
    paths:
      - "install.sh"
      - "one-shot-install.sh"
      - "scripts/**"
      - "pi-companion/**"
      - "firmware/**"
      - "training/**"
      - "systemd/**"
      - ".github/workflows/installer-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell entrypoints
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(find . -type f -name '*.sh' -print0)

      - name: Validate Python entrypoints
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts pi-companion firmware/esp32-dualeye/scripts firmware/t114-combined-safe/scripts

      - name: Validate single-owner serial command bus
        env:
          PYTHONPATH: pi-companion
        run: python3 scripts/check_serial_command_bus.py

      - name: Validate owned-node scan allowlist
        env:
          PYTHONPATH: pi-companion
        run: python3 scripts/check_owned_scan_allowlist.py

      - name: Validate complex microphone pre-roll patch
        run: python3 firmware/esp32-dualeye/scripts/patch_complex_capture_preroll.py --check

      - name: Validate compiled ESP32 patch chain
        run: python3 scripts/check_esp32_compiled_patch_chain.py

      - name: Validate hardened installer invariants
        run: |
          set -euo pipefail
          grep -Fq 'ZEPHYR_SDK_VERSION:-0.16.8' scripts/setup_nrf_connect_sdk_toolchain.sh
          grep -Fq 'preflight_firmware_host.sh --before-build' scripts/build_whole_system_firmware.sh
          grep -Fq 'preflight_firmware_host.sh --before-flash' scripts/deploy_whole_system_firmware.sh
          grep -Fq 'check_supported_host.py' scripts/preflight_firmware_host.sh
          grep -Fq 'do not run the installer as' scripts/preflight_firmware_host.sh
          grep -Fq 'esp32-source-backup' scripts/build_whole_system_firmware.sh
          grep -Fq 'atomic_bundle_publish' scripts/build_whole_system_firmware.sh
          grep -Fq 'DEBIAN_FRONTEND=noninteractive' scripts/setup_system_packages.sh
          grep -Fq 'firmware_bundle_preserved' scripts/cleanup_firmware_build_tools.sh
          grep -Fq 'install_esp32_serial_owner' scripts/run_esp32_dualeye_voice_bridge.py
          grep -Fq 'install_heltec_serial_owner' scripts/run_ble_node_manager.py
          grep -Fq 'claim_acknowledgement_required' scripts/check_serial_command_bus.py
          grep -Fq 'HELTEC_MAX_LINE_BYTES = 255' pi-companion/koalablue/runtime_serial_ownership.py
          grep -Fq 'KILLERKOALA_LLM_NUM_CTX' pi-companion/koalablue/killerkoala_runtime_limits.py
          grep -Fq '/api/tags' scripts/check_live_runtime_services.py
          grep -Fq 'core.playback.get_state' scripts/check_live_runtime_services.py
          grep -Fq 'new_restarts_during_health_check' scripts/check_live_runtime_services.py
          grep -Fq 'install_runtime_log_rotation.sh' scripts/setup_pi_hardware_stage.sh
          grep -Fq 'brokered_t114_fix' pi-companion/koalablue/gnss_location.py
          grep -Fq 'serial_owner_snapshot' pi-companion/koalablue/t114_menu_status.py
          grep -Fq 'direct_serial_open": False' pi-companion/koalablue/t114_runtime_broker.py
          grep -Fq 'append_jsonl' pi-companion/koalablue/menu_display_sync.py
          grep -Fq 'pocketsphinx>=5.0.3' pi-companion/requirements.txt
          grep -Fq 'wake_already_confirmed' pi-companion/koalablue/esp32_dualeye_error_dig_bridge.py
          grep -Fq 'PARAMETER num_ctx 768' training/killerkoala_lora/Modelfile.killerkoala-tinyllama
          grep -Fq 'install -m 0600' scripts/provision_esp32_wifi_env.sh
          grep -Fq 'pcm.koalabyte_dmix' scripts/configure_shared_alsa_output.sh
          grep -Fq 'systemctl reset-failed ollama.service' scripts/setup_killerkoala_ollama.sh
          grep -Fq 'systemctl reset-failed mopidy.service' scripts/setup_mopidy_player.sh
          grep -Fq '#include "integrated_main.cpp"' firmware/esp32-dualeye/src/integrated_main_clean_voice.cpp
          grep -Fq 'owned_scan_reason' pi-companion/koalablue/owned_scan_runtime.py
          grep -Fq 'install_owned_scan_allowlist' pi-companion/koalablue/__init__.py
          for patch in patch_guarded_ble_failover.py patch_tone_expression_payloads.py patch_alarm_background.py; do
            grep -Fq 'integrated_main.cpp' "firmware/esp32-dualeye/scripts/${patch}"
          done
