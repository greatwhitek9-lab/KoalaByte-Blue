name: KoalaByte Blue Release Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'koalabyte-blue-v*'

jobs:
  package:
    name: Build canonical Pi install package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pi runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pi-companion/requirements.txt

      - name: Validate final installer
        run: |
          bash -n install.sh
          bash -n one-shot-install.sh
          PYTHONPATH=pi-companion python scripts/check_one_shot_controls.py
          PYTHONPATH=pi-companion python scripts/check_killerkoala_ai.py
          INSTALL_INNOMAKER_CAN=0 PYTHONPATH=pi-companion python scripts/check_full_runtime_dependencies.py

      - name: Build package folder
        run: |
          set -euo pipefail
          mkdir -p dist/KoalaByte-Blue
          rsync -a \
            --exclude '.git' \
            --exclude 'dist' \
            --exclude 'exports' \
            --exclude 'logs' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude 'firmware/prebuilt' \
            README.md install.sh one-shot-install.sh scripts pi-companion firmware docs production systemd udev logrotate version training .github \
            dist/KoalaByte-Blue/
          test -f dist/KoalaByte-Blue/one-shot-install.sh
          test ! -e dist/KoalaByte-Blue/firmware/prebuilt/manifest.json
          (cd dist && zip -r KoalaByte-Blue-install-package.zip KoalaByte-Blue >/dev/null)

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: KoalaByte-Blue-install-package
          path: dist/KoalaByte-Blue-install-package.zip
          retention-days: 14
