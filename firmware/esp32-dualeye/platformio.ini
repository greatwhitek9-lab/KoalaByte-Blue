[platformio]
default_envs = esp32s3_dualeye

[env:esp32s3_dualeye]
; Pin the pioarduino platform instead of following the moving stable alias.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
extra_scripts =
  pre:scripts/fetch_waveshare_audio_deps.py
  pre:scripts/generate_voice_menu_catalog.py
  pre:scripts/limit_multinet_local_grammar.py
  pre:scripts/generate_local_voice_responses.py
  pre:scripts/generate_wake_session_source.py
  pre:scripts/patch_complex_capture_preroll.py
  pre:scripts/patch_guarded_ble_failover.py
  pre:scripts/patch_tone_expression_payloads.py
  pre:scripts/patch_alarm_background.py
  pre:scripts/patch_tinyllama_vocabulary_fallback.py
  pre:scripts/patch_wake_session_awake_eyes.py
  pre:scripts/patch_local_response_bank.py
  pre:scripts/patch_local_speech_lifecycle.py
  pre:scripts/patch_release_version.py
  pre:scripts/patch_vendor_mic_gain_profile.py
  pre:scripts/patch_protocol_status.py
  pre:scripts/patch_pi_wake_stt_fallback.py
  pre:scripts/patch_quarantine_legacy_esp_sr_transport.py
build_src_filter =
  +<*>
  -<main.cpp>
  -<integrated_main.cpp>
  -<integrated_main_clean_voice.cpp>
  -<boot_animation.cpp>
  -<koalagotchi_mode_screens.cpp>
  -<menu_theme.cpp>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_LOOP_STACK_SIZE=16384
  -DCONFIG_MODEL_IN_FLASH=1
  -DARDUINO_PARTITION_esp_sr_16
lib_ldf_mode = deep+
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^1.4.3
  adafruit/Adafruit GFX Library@^1.12.0
  https://github.com/adafruit/Adafruit_GC9A01A.git#1.1.1
