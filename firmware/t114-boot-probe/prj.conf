# Minimal Heltec T114 bootability probe for the HT-n5262 UF2 bootloader.
# Deliberately excludes display, Bluetooth, GNSS, LoRa, SPI and application storage.

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PRINTK=y
CONFIG_LOG=n

CONFIG_BUILD_OUTPUT_UF2=y

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y

CONFIG_BT=n
CONFIG_DISPLAY=n
CONFIG_GNSS=n
CONFIG_LORA=n
CONFIG_SPI=n
CONFIG_SENSOR=n
