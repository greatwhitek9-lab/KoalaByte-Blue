# Isolated Heltec T114 display probe for the HT-n5262 UF2 bootloader.
# USB CDC, one-second LED heartbeat and ST7789 only.
# Bluetooth, GNSS, LoRa and unrelated sensors remain disabled.

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PRINTK=y
CONFIG_LOG=n

CONFIG_BUILD_OUTPUT_UF2=y

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ST7789V=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y

CONFIG_BT=n
CONFIG_GNSS=n
CONFIG_LORA=n
CONFIG_SENSOR=n
CONFIG_IEEE802154=n
CONFIG_LED_STRIP=n
